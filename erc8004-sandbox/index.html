<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERC-8004 协议沙盒 · Trustless Agents</title>
<style>
  :root{
    --bg:#F7F7F4; --card:#FFFFFF; --border:#E3E1D9; --border2:#C9C7BD;
    --text:#2C2C2A; --muted:#6E6D66; --faint:#9C9B93;
    --blue:#185FA5; --blue-bg:#E6F1FB; --purple:#534AB7; --purple-bg:#EEEDFE;
    --teal:#0F6E56; --teal-bg:#E1F5EE; --amber:#854F0B; --amber-bg:#FAEEDA;
    --coral:#993C1D; --coral-bg:#FAECE7; --red:#A32D2D;
    --mono:ui-monospace,'Cascadia Code',Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
  header h1{font-size:17px;font-weight:600}
  header .sub{font-size:12px;color:var(--muted)}
  .chain-badge{display:inline-flex;align-items:center;gap:6px;background:var(--teal-bg);color:var(--teal);border:1px solid var(--teal);border-radius:20px;padding:3px 12px;font-size:12px;font-family:var(--mono)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  nav{display:flex;gap:4px;background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;overflow-x:auto}
  nav button{border:none;background:none;padding:12px 16px;font-size:13.5px;cursor:pointer;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap;font-family:inherit}
  nav button.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
  main{max-width:980px;margin:20px auto;padding:0 20px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:16px}
  .card h2{font-size:15px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .card h3{font-size:13.5px;font-weight:600;margin:12px 0 6px}
  .step-tag{font-size:11px;padding:2px 8px;border-radius:10px;color:#fff;font-weight:500}
  .muted{color:var(--muted);font-size:12.5px}
  .mono{font-family:var(--mono);font-size:12px}
  pre.json{background:#FAFAF7;border:1px solid var(--border);border-radius:8px;padding:12px;font-family:var(--mono);font-size:12px;overflow-x:auto;line-height:1.55;white-space:pre-wrap;word-break:break-all}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:760px){.grid2{grid-template-columns:1fr}}
  label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
  input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--border2);border-radius:8px;font-size:13px;font-family:inherit;background:#fff;color:var(--text)}
  input:focus,select:focus{outline:2px solid var(--blue-bg);border-color:var(--blue)}
  .btn{display:inline-block;border:none;border-radius:8px;padding:9px 18px;font-size:13.5px;cursor:pointer;font-family:inherit;font-weight:500;margin-top:12px}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-purple{background:var(--purple);color:#fff}
  .btn-teal{background:var(--teal);color:#fff}
  .btn-ghost{background:#fff;color:var(--text);border:1px solid var(--border2)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-sm{padding:5px 12px;font-size:12px;margin-top:0}
  .agent-card{border:1px solid var(--border);border-radius:12px;padding:16px;position:relative}
  .agent-card .nft{border:1px solid var(--border);border-radius:10px;background:linear-gradient(135deg,var(--blue-bg),var(--purple-bg));padding:14px;margin:10px 0}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;margin-right:6px}
  .b-blue{background:var(--blue-bg);color:var(--blue)}
  .b-purple{background:var(--purple-bg);color:var(--purple)}
  .b-teal{background:var(--teal-bg);color:var(--teal)}
  .b-amber{background:var(--amber-bg);color:var(--amber)}
  .b-coral{background:var(--coral-bg);color:var(--coral)}
  .b-red{background:#FCEBEB;color:var(--red)}
  .b-gray{background:#F1EFE8;color:var(--muted)}
  .stat-row{display:flex;gap:18px;margin:10px 0;font-size:12.5px}
  .stat b{font-size:16px;font-weight:600;display:block}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--border)}
  td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
  tr:last-child td{border-bottom:none}
  .hash{font-family:var(--mono);font-size:11.5px;color:var(--blue)}
  .ev{font-family:var(--mono);font-size:11.5px;font-weight:600}
  .status-line{font-size:12.5px;padding:6px 10px;border-left:3px solid var(--border2);background:#FAFAF7;margin:6px 0;border-radius:0 6px 6px 0}
  .status-line.ok{border-left-color:var(--teal);color:var(--teal)}
  .status-line.info{border-left-color:var(--blue)}
  .status-line.warn{border-left-color:var(--amber)}
  .score-big{font-size:30px;font-weight:600;font-family:var(--mono)}
  input[type=range]{width:100%;accent-color:var(--purple)}
  .steps-demo li{margin:8px 0;font-size:13px}
  .hint{background:var(--amber-bg);border:1px solid var(--amber);border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--amber);margin:10px 0}
  .success{background:var(--teal-bg);border:1px solid var(--teal);border-radius:8px;padding:12px 16px;margin:10px 0;font-size:13px;color:var(--teal)}
  ol.script{padding-left:20px}
  ol.script li{margin:7px 0}
  .kv{font-size:12.5px}
  .kv b{font-weight:600}
  .empty{color:var(--faint);text-align:center;padding:24px;font-size:13px}
  .fade-in{animation:fadein .4s}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  #langBtn{font-weight:600}
</style>
</head>
<body>

<header>
  <div>
    <h1 data-i18n="app.title">ERC-8004 协议沙盒</h1>
    <div class="sub" data-i18n="app.sub"></div>
    <div class="sub" data-i18n="app.sub2"></div>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <span class="chain-badge"><span class="dot"></span><span id="chainStat"></span></span>
    <button class="btn btn-ghost btn-sm" id="langBtn" onclick="switchLang()">English</button>
    <button class="btn btn-ghost btn-sm" onclick="resetAll()" data-i18n="app.reset"></button>
  </div>
</header>

<nav id="tabs">
  <button data-tab="overview" class="active" data-i18n="tab.overview"></button>
  <button data-tab="register" data-i18n="tab.register"></button>
  <button data-tab="discover" data-i18n="tab.discover"></button>
  <button data-tab="feedback" data-i18n="tab.feedback"></button>
  <button data-tab="explorer" data-i18n="tab.explorer"></button>
</nav>

<main>

<!-- ============ 总览 ============ -->
<section id="tab-overview">
  <div class="card">
    <h2><span class="step-tag" style="background:var(--blue)" data-i18n="ov.tag"></span><span data-i18n="ov.h"></span></h2>
    <p style="font-size:13.5px" data-i18n="ov.text"></p>
    <div class="hint" data-i18n="ov.hint"></div>
  </div>
  <div class="card">
    <h2><span class="step-tag" style="background:var(--purple)" data-i18n="ov.scriptTag"></span><span data-i18n="ov.scriptH"></span></h2>
    <ol class="script">
      <li data-i18n="ov.s1"></li>
      <li data-i18n="ov.s2"></li>
      <li data-i18n="ov.s3"></li>
      <li data-i18n="ov.s4"></li>
      <li data-i18n="ov.s5"></li>
      <li data-i18n="ov.s6"></li>
    </ol>
  </div>
  <div class="grid2">
    <div class="card">
      <h2><span class="step-tag" style="background:var(--teal)" data-i18n="ov.dataTag"></span><span data-i18n="ov.chainH"></span></h2>
      <div id="chainSummary"></div>
    </div>
    <div class="card">
      <h2><span class="step-tag" style="background:var(--coral)" data-i18n="ov.ptsTag"></span><span data-i18n="ov.ptsH"></span></h2>
      <ul style="padding-left:18px;font-size:13px">
        <li data-i18n="ov.p1"></li>
        <li data-i18n="ov.p2"></li>
        <li data-i18n="ov.p3"></li>
      </ul>
    </div>
  </div>
</section>

<!-- ============ 注册 ============ -->
<section id="tab-register" style="display:none">
  <div class="grid2">
    <div class="card">
      <h2><span class="step-tag" style="background:var(--blue)" data-i18n="reg.tag12"></span><span data-i18n="reg.h1"></span></h2>
      <p class="muted" data-i18n="reg.hint"></p>
      <label data-i18n="reg.name"></label>
      <input id="regName" data-i18n-ph="reg.namePh">
      <label data-i18n="reg.desc"></label>
      <input id="regDesc" data-i18n-ph="reg.descPh">
      <label data-i18n="reg.a2a"></label>
      <input id="regA2A" data-i18n-ph="reg.a2aPh">
      <label data-i18n="reg.mcp"></label>
      <input id="regMCP" data-i18n-ph="reg.mcpPh">
      <label data-i18n="reg.ens"></label>
      <input id="regENS" data-i18n-ph="reg.ensPh">
      <button class="btn btn-primary" id="regBtn" onclick="registerAgent()" data-i18n="reg.btn"></button>
      <div id="regResult"></div>
    </div>
    <div class="card">
      <h2><span class="step-tag" style="background:var(--blue)" data-i18n="reg.tag3"></span><span data-i18n="reg.h2"></span></h2>
      <p class="muted" data-i18n="reg.hint2"></p>
      <label data-i18n="reg.pickAgent"></label>
      <select id="verifyOwnTarget"></select>
      <button class="btn btn-ghost" onclick="simulateOwnershipProof()" data-i18n="reg.ownBtn"></button>
      <div id="ownResult"></div>
      <h3 data-i18n="reg.list"></h3>
      <div id="regList" class="mono" style="font-size:12px;color:var(--muted)"></div>
    </div>
  </div>
</section>

<!-- ============ 发现与委托 ============ -->
<section id="tab-discover" style="display:none">
  <div class="card">
    <h2><span class="step-tag" style="background:var(--purple)" data-i18n="dis.tag"></span><span data-i18n="dis.h1"></span></h2>
    <p class="muted" data-i18n="dis.hint"></p>
    <div class="grid2" id="discoverList"></div>
  </div>
  <div class="card">
    <h2><span class="step-tag" style="background:var(--purple)" data-i18n="task.tag"></span><span data-i18n="task.h1"></span></h2>
    <div class="grid2">
      <div>
        <label data-i18n="task.pickAgent"></label>
        <select id="taskAgent"></select>
        <label data-i18n="task.type"></label>
        <select id="taskType">
          <option data-i18n="task.t1"></option>
          <option data-i18n="task.t2"></option>
          <option data-i18n="task.t3"></option>
        </select>
        <label data-i18n="task.risk"></label>
        <select id="taskRisk">
          <option value="low" data-i18n="task.low"></option>
          <option value="high" data-i18n="task.high"></option>
        </select>
        <label data-i18n="task.custom"></label>
        <input id="taskCustom" data-i18n-ph="task.customPh">
        <button class="btn btn-purple" id="taskBtn" onclick="runTask()" data-i18n="task.btn"></button>
        <div id="taskStatus"></div>
      </div>
      <div>
        <h3 data-i18n="task.process"></h3>
        <div id="taskLog"><div class="empty"></div></div>
      </div>
    </div>
  </div>
</section>

<!-- ============ 反馈与验证 ============ -->
<section id="tab-feedback" style="display:none">
  <div class="grid2">
    <div class="card">
      <h2><span class="step-tag" style="background:var(--purple)" data-i18n="fb.tag"></span><span data-i18n="fb.h1"></span></h2>
      <p class="muted" data-i18n="fb.hint"></p>
      <label data-i18n="fb.agent"></label>
      <select id="fbAgent"></select>
      <label><span data-i18n="fb.value"></span><span id="fbVal" class="mono" style="color:var(--purple)">85</span></label>
      <input type="range" id="fbRange" min="-100" max="100" value="85" oninput="document.getElementById('fbVal').textContent=this.value">
      <label data-i18n="fb.note"></label>
      <input id="fbNote" data-i18n-ph="fb.notePh">
      <button class="btn btn-purple" onclick="giveFeedback()" data-i18n="fb.btn"></button>
      <div id="fbResult"></div>
    </div>
    <div class="card">
      <h2><span class="step-tag" style="background:var(--teal)" data-i18n="val.tag"></span><span data-i18n="val.h1"></span></h2>
      <p class="muted" data-i18n="val.hint"></p>
      <label data-i18n="val.agent"></label>
      <select id="valAgent"></select>
      <label data-i18n="val.method"></label>
      <select id="valMethod">
        <option value="TEE" data-i18n="val.tee"></option>
        <option value="zkML" data-i18n="val.zkml"></option>
        <option value="Re-exec" data-i18n="val.reexec"></option>
      </select>
      <button class="btn btn-teal" id="valBtn" onclick="requestValidation()" data-i18n="val.btn"></button>
      <div id="valResult"></div>
    </div>
  </div>
  <div class="card">
    <h2><span class="step-tag" style="background:var(--teal)" data-i18n="rep.tag"></span><span data-i18n="rep.h1"></span></h2>
    <p class="muted" data-i18n="rep.hint"></p>
    <div style="overflow-x:auto"><table id="repTable"></table></div>
  </div>
</section>

<!-- ============ Explorer ============ -->
<section id="tab-explorer" style="display:none">
  <div class="card">
    <h2><span class="step-tag" style="background:var(--amber)" data-i18n="ex.tag"></span><span data-i18n="ex.h1"></span></h2>
    <p class="muted" data-i18n="ex.hint"></p>
    <div style="overflow-x:auto"><table id="txTable"></table></div>
  </div>
</section>

</main>

<script>
/* ================= 多语言 ================= */
const I18N = {
  zh: {

let LANG = localStorage.getItem('erc8004_demo_lang') || 'zh';

function t(key, vars){
  let s = (I18N[LANG] && I18N[LANG][key]) || I18N.zh[key] || key;
  if(vars) for(const k in vars) s = s.split('{' + k + '}').join(vars[k]);
  return s;
}

function applyStatic(){
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.title = t('app.title') + ' · Trustless Agents';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.getElementById('langBtn').textContent = t('lang.self');
}

function switchLang(){
  LANG = LANG === 'zh' ? 'en' : 'zh';
  localStorage.setItem('erc8004_demo_lang', LANG);
  applyStatic();
  renderAll();
}

/* ================= 状态与持久化 ================= */
const LS_KEY = 'erc8004_demo_v1';
let state = null;

function mockHash(){ let s='0x'; const c='0123456789abcdef'; for(let i=0;i<40;i++) s+=c[Math.floor(Math.random()*16)]; return s; }
function mockCID(){ const c='abcdefghijklmnopqrstuvwxyz234567'; let s='bafybei'; for(let i=0;i<26;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }
function mockAddr(){ let s='0x'; const c='0123456789abcdef'; for(let i=0;i<40;i++) s+=c[Math.floor(Math.random()*16)]; return s; }
const CLIENT = '0xA11cE0000000000000000000000000000000c0dE';

        verified:true,
        feedbacks:[{client:CLIENT,value:95,noteKey:'seed.oracle.note1',ts:Date.now()-86400000*3},{client:mockAddr(),value:88,noteKey:'seed.oracle.note2',ts:Date.now()-86400000*2}],
        validations:[{method:'TEE',score:92,ts:Date.now()-86400000*2}] },

      {block:4,hash:mockHash(),ev:'Register',data:'agentId=2 · TradeExecutor'},

}
function load(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){ return null; } }
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
function resetAll(){ if(confirm(LANG==='zh' ? '确定重置全部状态吗？' : 'Reset all state?')){ localStorage.removeItem(LS_KEY); state = seedState(); save(); renderAll(); } }

state = load() || seedState(); save();

function agentDesc(a){ return a.descKey ? t(a.descKey) : a.desc; }

/* ================= 链上动作（模拟） ================= */
function tx(ev, data){ state.block++; state.txs.unshift({block:state.block, hash:mockHash(), ev, data}); save(); }

function registerAgent(){
  const name = document.getElementById('regName').value.trim();
  if(!name){ alert(t('reg.needName')); return; }
  const cid = mockCID();
  const a = {
    id: state.agents.length + 1,
    name, desc: document.getElementById('regDesc').value.trim() || '—',
    owner: mockAddr(), cid,
    endpoints:{ a2a: document.getElementById('regA2A').value.trim()||'https://pending.example/agent-card',
                mcp: document.getElementById('regMCP').value.trim()||'https://pending.example/mcp',
                ens: document.getElementById('regENS').value.trim()||'' },
    verified:false, feedbacks:[], validations:[]
  };
  state.agents.push(a);
  tx('Register', 'agentId=' + a.id + ' · ' + name);
  save();
  document.getElementById('regResult').innerHTML =
    '<div class="success fade-in">' + t('reg.mintOk',{id:a.id}) + '<br>' +
    '<span class="mono" style="font-size:11.5px">agentURI: ipfs://' + cid + '/agent.json</span><br>' +
    '<span class="mono" style="font-size:11.5px">' + t('reg.globalId') + ': eip155:11155111:0x8004Registry:' + a.id + '</span></div>' +
    nftCardHTML(a);
  renderAll();
}

function nftCardHTML(a){

function simulateOwnershipProof(){
  const id = +document.getElementById('verifyOwnTarget').value;
  const a = state.agents.find(x=>x.id===id); if(!a) return;
  tx('OwnershipProof', 'agentId=' + id + ' · ' + t('ex.ownership'));
  a.verified = true; save();
  document.getElementById('ownResult').innerHTML =
    '<div class="success fade-in">' + t('reg.ownOk',{ens:a.endpoints.ens||'example.eth'}) + '</div>';
  renderAll();
}

/* ================= 发现与委托 ================= */
function agentJSON(a){
  return JSON.stringify({
    name: a.name, description: agentDesc(a),
    endpoints: a.endpoints, verified: a.verified,
    reputationRef: 'eip155:11155111:ReputationRegistry',
    validationRef: 'eip155:11155111:ValidationRegistry'
  }, null, 2);
}

function scoresOf(a){
  const fb = a.feedbacks.length ? a.feedbacks.reduce((s,f)=>s+f.value,0)/a.feedbacks.length : null;
  const val = a.validations.length ? a.validations.reduce((s,v)=>s+v.score,0)/a.validations.length : null;
  const ins = (val!==null && fb!==null) ? Math.round(val*0.6 + (fb+100)/2*0.4) : null;
  return {fb, val, ins};
}

function discoverHTML(a){
  const s = scoresOf(a);
  return '<div class="agent-card">' +
    '<div style="display:flex;justify-content:space-between;align-items:start"><b style="font-size:14.5px">' + a.name + '</b>' +
    '<span class="mono" style="font-size:11px;color:var(--faint)">#' + a.id + '</span></div>' +
    '<div class="muted" style="margin:4px 0">' + agentDesc(a) + '</div>' +
    '<div>' + (a.verified?'<span class="badge b-teal">'+t('dis.verified')+'</span>':'<span class="badge b-gray">'+t('dis.unverified')+'</span>') +
    (a.validations.length?'<span class="badge b-amber">'+t('dis.valN',{n:a.validations.length})+'</span>':'<span class="badge b-coral">'+t('dis.noVal')+'</span>') + '</div>' +
    '<div class="stat-row"><div class="stat"><b>' + (s.fb===null?'—':s.fb.toFixed(1)) + '</b><span class="muted">'+t('dis.market')+'</span></div>' +
    '<div class="stat"><b>' + (s.ins===null?'—':s.ins) + '</b><span class="muted">'+t('dis.ins')+'</span></div>' +
    '<div class="stat"><b>' + a.feedbacks.length + '</b><span class="muted">'+t('dis.fbCount')+'</span></div></div>' +
    '<details><summary class="muted" style="cursor:pointer;font-size:12.5px">'+t('dis.viewFile')+'</summary>' +
    '<pre class="json" style="margin-top:8px">ipfs://' + a.cid + '/agent.json\n\n' + agentJSON(a) + '</pre></details>' +
    '</div>';
}

function runTask(){
  const id = +document.getElementById('taskAgent').value;
  const a = state.agents.find(x=>x.id===id); if(!a) return;
  const type = document.getElementById('taskCustom').value.trim() || document.getElementById('taskType').value;
  const risk = document.getElementById('taskRisk').value;
  const btn = document.getElementById('taskBtn'); btn.disabled = true;
  const log = document.getElementById('taskLog'); log.innerHTML = '';
  const steps = [
    ['info', t('task.s1',{agent:a.name})],
    ['info', t('task.s2',{task:type})],
    ['warn', t('task.s3')]
  ];
  let i = 0;
  const timer = setInterval(()=>{
    if(i < steps.length){
      const s = steps[i++];
      log.innerHTML += '<div class="status-line ' + s[0] + '">' + s[1] + '</div>';
    } else {
      clearInterval(timer); btn.disabled = false;
      if(risk === 'high'){
        log.innerHTML += '<div class="status-line warn">' + t('task.doneHigh') + '</div>';
      } else {
        log.innerHTML += '<div class="status-line ok">' + t('task.doneLow') + '</div>';
      }
      log.innerHTML += '<div class="hint" style="margin-top:10px">' + t('task.offchain') + '</div>';
      window.lastTask = {agentId:id, type, risk, ts:Date.now()};
    }
  }, 900);
}

/* ================= 反馈与验证 ================= */
function giveFeedback(){
  const id = +document.getElementById('fbAgent').value;
  const a = state.agents.find(x=>x.id===id); if(!a) return;
  const v = +document.getElementById('fbRange').value;
  const note = document.getElementById('fbNote').value.trim() || '—';
  const ecid = mockCID();
  a.feedbacks.push({client:CLIENT, value:v, note, ts:Date.now()});
  tx('GiveFeedback', 'agentId=' + id + ' · value=' + v + ' · evidence=ipfs://' + ecid.slice(0,10) + '…');
  save();
  document.getElementById('fbResult').innerHTML =
    '<div class="success fade-in">' + t('fb.ok') + '<br><span class="mono" style="font-size:11.5px">giveFeedback(agentId=' + id + ', value=' + v + ', valueDecimals=0, fileURI="ipfs://' + ecid + '/review.json")</span></div>';
  renderAll();
}

function requestValidation(){
  const id = +document.getElementById('valAgent').value;
  const a = state.agents.find(x=>x.id===id); if(!a) return;
  const method = document.getElementById('valMethod').value;
  const btn = document.getElementById('valBtn'); btn.disabled = true;
  tx('ValidationRequest', 'agentId=' + id + ' · method=' + method);
  save();
  const box = document.getElementById('valResult');
  box.innerHTML = '<div class="status-line info fade-in">' + t('val.pending') + '</div>';
  setTimeout(()=>{
    const score = 80 + Math.floor(Math.random()*19); // 80-98
    a.validations.push({method, score, ts:Date.now()});
    tx('ValidationResponse', 'agentId=' + id + ' · ' + method + ' · score=' + score);
    save();
    box.innerHTML = '<div class="success fade-in">' + t('val.ok') + '<br><div class="score-big" style="color:var(--teal)">' + score + '<span style="font-size:14px;color:var(--muted)">' + t('val.slash') + '</span></div>' +
      '<span class="mono" style="font-size:11.5px">' + t('val.threshold',{method:method}) + '</span></div>';
    btn.disabled = false;
    renderAll();
  }, 1800);
}

/* ================= 渲染 ================= */
function fillSelect(id, list, labelFn){
  const el = document.getElementById(id);
  const cur = el.value;
  el.innerHTML = list.map(a=>'<option value="' + a.id + '">' + (labelFn?labelFn(a):a.id + ' · ' + a.name) + '</option>').join('');
  if(cur && list.some(a=>a.id==cur)) el.value = cur;
}

function renderRepTable(){
  const t_ = document.getElementById('repTable');
  if(!state.agents.length){ t_.innerHTML = '<tr><td class="empty">'+t('rep.noAgents')+'</td></tr>'; return; }
  t_.innerHTML = '<tr><th>'+t('rep.thAgent')+'</th><th>'+t('rep.thFb')+'</th><th>'+t('rep.thMarket')+'<br><span style="font-size:11px">'+t('rep.thMarketSub')+'</span></th><th>'+t('rep.thVal')+'</th><th>'+t('rep.thIns')+'<br><span style="font-size:11px">'+t('rep.thInsSub')+'</span></th></tr>' +
    state.agents.map(a=>{
      const s = scoresOf(a);
      return '<tr><td><b>' + a.name + '</b> <span class="mono" style="color:var(--faint)">#' + a.id + '</span></td>' +
        '<td>' + a.feedbacks.length + '</td>' +
        '<td>' + (s.fb===null?'<span class="muted">'+t('rep.noSignal')+'</span>':'<b style="color:' + (s.fb>=80?'var(--teal)':s.fb>=60?'var(--amber)':'var(--red)') + '">' + s.fb.toFixed(1) + '</b>') + '</td>' +
        '<td>' + (s.val===null?'<span class="muted">'+t('rep.unverified')+'</span>':s.val.toFixed(0)) + '</td>' +
        '<td>' + (s.ins===null?'<span class="muted">'+t('rep.needVal')+'</span>':'<b>' + s.ins + '</b>') + '</td></tr>';
    }).join('');
}

function renderExplorer(){
  const t_ = document.getElementById('txTable');
  t_.innerHTML = '<tr><th>'+t('ex.thBlock')+'</th><th>'+t('ex.thHash')+'</th><th>'+t('ex.thEvent')+'</th><th>'+t('ex.thData')+'</th></tr>' +
    state.txs.map(x=>{
      const color = x.ev.startsWith('Reg')?'var(--blue)':x.ev.startsWith('Give')?'var(--purple)':'var(--teal)';
      return '<tr><td class="mono">#' + x.block + '</td>' +
        '<td><span class="hash">' + x.hash.slice(0,12) + '…' + x.hash.slice(-4) + '</span></td>' +
        '<td><span class="ev" style="color:' + color + '">' + x.ev + '</span></td>' +
        '<td class="mono" style="font-size:11.5px">' + x.data + '</td></tr>';
    }).join('');
}

function renderAll(){
  document.getElementById('chainStat').textContent = t('chain.badge',{block:state.block, n:state.agents.length});
  document.getElementById('chainSummary').innerHTML =
    '<div class="stat-row" style="gap:30px">' +
    '<div class="stat"><b>' + state.block + '</b><span class="muted">'+t('cs.block')+'</span></div>' +
    '<div class="stat"><b>' + state.agents.length + '</b><span class="muted">'+t('cs.agents')+'</span></div>' +
    '<div class="stat"><b>' + state.txs.filter(x=>x.ev==='GiveFeedback').length + '</b><span class="muted">'+t('cs.fb')+'</span></div>' +
    '<div class="stat"><b>' + state.txs.filter(x=>x.ev==='ValidationResponse').length + '</b><span class="muted">'+t('cs.val')+'</span></div></div>';
  fillSelect('verifyOwnTarget', state.agents);
  fillSelect('taskAgent', state.agents);
  fillSelect('fbAgent', state.agents);
  fillSelect('valAgent', state.agents);
  document.getElementById('discoverList').innerHTML = state.agents.map(discoverHTML).join('') || '<div class="empty">'+t('dis.empty')+'</div>';
  document.getElementById('regList').innerHTML = state.agents.map(a=>'#' + a.id + ' ' + a.name + (a.verified?' ✓':'')).join('<br>') || t('reg.empty');
  renderRepTable();
  renderExplorer();
}

/* ================= 标签页 ================= */
document.querySelectorAll('#tabs button').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    ['overview','register','discover','feedback','explorer'].forEach(tp=>{
      document.getElementById('tab-' + tp).style.display = tp===b.dataset.tab ? '' : 'none';
    });
  };
});

applyStatic();
renderAll();
</script>
</body>
</html>
